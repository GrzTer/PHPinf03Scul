<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restauracja Wszystkie Smaki</title>
  <link rel="stylesheet" href="styl_1.css">
</head>
<body>
  <header>
    <h1>Witamy w restauracji „Wszystkie Smaki”</h1>
  </header>

  <section id="lewy">
    <img src="menu.jpg" alt="Nasze danie">
  </section>

  <section id="prawy">
    <h4>U nas dobrze zjesz!</h4>
    <ol>
      <li>Obiady od 40 zł</li>
      <li>Przekąski od 10 zł</li>
      <li>Kolacje od 20 zł</li>
    </ol>
  </section>

  <section id="dolny">
    <h2>Zarezerwuj stolik on-line</h2>
    <form action="rezerwacja.php" method="post">
      <label for="pData">Data (format rrrr-mm-dd):</label><br>
      <input type="date" name="pData" id="pData"><br>

      <label for="pIlosc">Ile osób?</label><br>
      <input type="number" name="pIlosc" id="pIlosc"><br>

      <label for="pTel">Twój numer telefonu:</label><br>
      <input type="tel" name="pTel" id="pTel"><br>

      <input required type="checkbox" name="pCheck" id="pCheck">
      <label for="pCheck">Zgadzam się na przetwarzanie moich danych osobowych</label><br>

      <button type="reset">WYCZYŚĆ</button>
      <button type="submit">REZERWUJ</button>
    </form>
  </section>

  <footer>
    <span>
        Stronę internetową opracował: <em>000000000</em></footer>
    </span>
</body>
</html>
