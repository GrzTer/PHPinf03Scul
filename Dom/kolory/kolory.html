<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomocnik CSS</title>
    <link rel="stylesheet" href="styl2.css" />
  </head>
  <body>
    <div id="kontener">
      <section id="banery">
        <header id="baner1">
          <h1>Pomocnik CSS</h1>
        </header>
        <header id="baner2">
          <ul>
            <li><a href="kolory.html">Kolory</a></li>
            <li><a href="czcionki.html">Czcionki</a></li>
            <li><a href="style.html">Style CSS</a></li>
            <li>
              <a
                target="_blank"
                rel="noopener"
                href="https://www.w3schools.com/css/"
                >Pomoc</a
              >
            </li>
          </ul>
        </header>
      </section>
      <main>
        <h2>Podaj składową H koloru w kodzie HSL</h2>
        <br />
        <p>
          0 do 30 czerwienie, do 60 żółcie, do 150 zielenie, do 250 niebieskie,
          do 360 fiolet i purpura
        </p>
        <br />
        <img src="kolory.jpg" alt="Przestrzeń barw HSL" /><br />
        <input id="hue" max="360" placeholder="0 - 360" type="number" />
        <button type="button" onclick="generatorHSL()">Generuj paletę</button>
        <table>
          <tr>
            <td colspan="4">Kolor główny</td>
          </tr>
          <tr>
            <td>kolor 2</td>
            <td>kolor 3</td>
            <td>kolor 4</td>
            <td>kolor 5</td>
          </tr>
        </table>
      </main>
      <footer><p>Autor: 000000000</p></footer>
    </div>
    <script>
      function generatorHSL() {
        const h = +document.getElementById("hue").value;
        [100, 80, 60, 40, 20].forEach(
          (s, i) =>
            (document.querySelectorAll("td")[
              i
            ].style.background = `hsl(${h},${s}%,50%)`)
        );
      }
    </script>
  </body>
</html>
