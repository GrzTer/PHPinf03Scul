<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>
    <header><h2>Chat</h2></header>
    <aside>
        <h3>Chaty</h3>
        <ul>
            <li>Ogólny</li>
            <li>Tematyczne
                <ol>
                    <li>Turystyczny</li>
                    <li>Żeglarski</li>
                    <li>Filatelistyczny</li>
                    <li>Hodowla zwierzątek domowych</li>
                </ol>
            </li>
        </ul>
        <h3>Uczestnicy</h3>
        <p>Jolanta Nowak</p>
        <img src="Jolka.jpg" alt="Jolanta Nowak">
        <p>Krzysztof Łukasiński</p>
        <img src="Krzysiek.jpg" alt="Krzysztof Łukasiński">
    </aside>
    <main>
        <section id="chat">
            <article class="Jolanta">
                <img src="Jolka.jpg" alt="Jolanta Nowak">
                <p>Cześć idziejsz jutro do kina?</p>
            </article>
            <article class="Krzysiek">
                <p>Tak! A ty?</p>
                <img src="Krzysiek.jpg" alt="Krzysztof Łukasiński">
            </article>
        </section>
        <label>Wpisz wiadomość:</label>
        <input id="wiadomosc" type="text">
        <button onclick="sendMessage()">Wyślij</button><br>
        <button onclick="generateRandomMessage()">Generuj losową odpowiedź</button>
    </main>
    <footer><h5>Chat wykonał: 000000000000</h5></footer>
    <script>
        const WIADOMOSCI_KRZYSKA = [
            "Świetnie!",
            "Kto gra główną rolę?",
            "Lubisz filmy Tego reżysera?",
            "Będę 10 minut wcześniej",
            "Może kupimy sobie popcorn?",
            "Ja wolę Colę",
            "Zaproszę jeszcze Grześka",
            "Tydzień temu też byłem w kinie na Diunie",
            "Ja funduję bilety"
        ];
        function sendMessage() {
            const text = document.getElementById('wiadomosc').value;

            const blokwiadomosci = document.createElement('article');
            blokwiadomosci.className = 'Jolanta';
            
            const profilowe = document.createElement('img');
            profilowe.src = 'Jolka.jpg';
            profilowe.alt = 'Jolanta Nowak';

            const wiadomosc = document.createElement('p');
            wiadomosc.textContent = text;

            blokwiadomosci.appendChild(profilowe);
            blokwiadomosci.appendChild(wiadomosc);

            const doChata = document.getElementById('chat');
            doChata.appendChild(blokwiadomosci);
            doChata.scrollTop = doChata.scrollHeight;

            document.getElementById('wiadomosc').value = '';
        }
        function generateRandomMessage() {
            const randomIndex = Math.floor(Math.random() * WIADOMOSCI_KRZYSKA.length);
            const ranodmMessage = WIADOMOSCI_KRZYSKA[randomIndex];

            const blokwiadomosci = document.createElement('article');
            blokwiadomosci.className = 'Krzysiek';
            
            const profilowe = document.createElement('img');
            profilowe.src = 'Krzysiek.jpg';
            profilowe.alt = 'Krzysztof Łukasiński';
            
            const wiadomosc = document.createElement('p');
            wiadomosc.textContent = ranodmMessage;

            blokwiadomosci.appendChild(wiadomosc);
            blokwiadomosci.appendChild(profilowe);

            const doChata = document.getElementById('chat');
            doChata.appendChild(blokwiadomosci);
            doChata.scrollTop = doChata.scrollHeight;
        }
    </script>
</body>
</html>
