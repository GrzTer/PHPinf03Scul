<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styl_1.css">
    <title>Restauracja Wszystkie Smaki</title>
</head>
<body>
    <header><h1>Witamy w restauracji <q>Wszystkie Smaki</q></h1></header>
    <section name="left" class="left"><img src="menu.jpg" alt="Nasze danie"></section>
    <section name="right" class="right"><h4>U nas dobrze zjesz!</h4><ol><li>Obiady od 40zł;</li>
        <li>Przekąski od 10 zł;</li><li>Kolacje od 20 zł</li></ol></section>
    <section name="bottom" class="bottom"><h2>Zarezerwuj stolik on-line</h2>
        <form action="rezerwacja.php" method="post">
            <label for="data">Data (format rrrr-mm-dd):</label><br>
            <input type="date" id="data" name="data" required><br><br>

            <label for="ilosc">Ile osób?</label><br>
            <input type="number" id="ilosc" name="ilosc" min="1" required><br><br>

            <label for="telefon">Twój numer telefonu:</label><br>
            <input type="tel" id="telefon" name="telefon" required><br><br>

            <input type="checkbox" id="zgoda" name="zgoda" required>
            <label for="zgoda">Zgadzam się na przetwarzanie moich danych osobowych</label><br><br>

            <button type="reset">WYCZYŚĆ</button>
            <button type="submit">REZERWUJ</button>
        </form></section>
    <footer><p>Stronę internetową opracował: <i>00000000000</i></p></footer>
</body>
</html>
